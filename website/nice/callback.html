<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>본인확인</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #FFF4F8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #555;
    }
    .msg { text-align: center; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #FFD6E4;
      border-top-color: #FF6FA0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <p>본인확인 처리 중입니다...</p>
  </div>
  <script>
    // 모바일 앱(WebView)의 onNavigationRequest 가 먼저 인터셉트하는 것이 primary 경로이고,
    // 이 페이지가 실제로 로드된 경우는 아래 fallback/웹 경로가 처리합니다.
    (function () {
      var params           = new URLSearchParams(window.location.search);
      var webTransactionId = params.get('web_transaction_id') || '';
      var closed            = params.get('closed') === '1';

      var payload = JSON.stringify({
        source: 'nice_callback',
        webTransactionId: webTransactionId,
        closed: closed,
      });

      // 1) webview_flutter 가 주입하는 JavaScript 채널 (모바일 메인 프레임에서 로드된 경우)
      if (typeof NiceChannel !== 'undefined' && NiceChannel.postMessage) {
        NiceChannel.postMessage(webTransactionId);
      }

      // 2) Flutter Web — window.open()으로 띄운 팝업(표준창)인 경우.
      //    NICE 공식 문서 1.5의 웹 브라우저 예시(popup) 방식: 팝업이 이 콜백 URL로
      //    이동하면 opener(원래 앱 창)에게 결과를 postMessage로 전달하고 스스로 닫는다.
      if (window.opener) {
        try {
          window.opener.postMessage(payload, '*');
        } catch (e) { /* no-op */ }
        window.close();
        return;
      }

      // 3) 이 페이지가 iframe 안에서 로드된 경우 대비 — window.parent로 postMessage 전달.
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage(payload, '*');
        } catch (e) { /* no-op */ }
      }
    })();
  </script>
</body>
</html>
